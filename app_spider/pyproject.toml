[project]
name = "appbk-spider"
version = "0.1.0"
description = "Public App Store data collector for appbk"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "PyMySQL==1.1.2",
  "python-dotenv==1.1.1",
  "tenacity==9.1.2",
]

[project.scripts]
app-spider = "app_spider.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app_spider*"]

